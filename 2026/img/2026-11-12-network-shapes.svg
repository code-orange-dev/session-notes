</g>
<g fill="#F7931A" stroke="#0A0A0A" stroke-width="3">
<circle cx="80" cy="100" r="13"/><circle cx="220" cy="100" r="13"/><circle cx="60" cy="190" r="13"/><circle cx="240" cy="190" r="13"/><circle cx="105" cy="260" r="13"/><circle cx="195" cy="260" r="13"/>
<circle cx="390" cy="95" r="13"/><circle cx="510" cy="95" r="13"/><circle cx="400" cy="270" r="13"/><circle cx="500" cy="270" r="13"/>
