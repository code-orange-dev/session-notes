<g font-size="13" fill="#8A8A8A" text-anchor="middle"><text x="150" y="310">one server down = everyone alone</text><text x="450" y="310">a head node down = a branch goes dark</text><text x="750" y="310">one node down = take another path</text></g>
<g stroke="#F7931A" stroke-opacity=".6" stroke-width="3">
