<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="Inter,Helvetica,Arial,sans-serif">
<rect width="760" height="230" rx="16" fill="#0A0A0A"/>
<text x="30" y="36" font-size="12" font-weight="700" fill="#F7931A" letter-spacing="2">PAYJOIN V2, THE MESSAGE PATH</text>
<g fill="#161616" stroke="#ffffff" stroke-opacity=".25">
<rect x="30" y="70" width="140" height="70" rx="12"/><rect x="220" y="70" width="140" height="70" rx="12"/><rect x="410" y="70" width="140" height="70" rx="12"/><rect x="600" y="70" width="140" height="70" rx="12" fill="#1d1408" stroke="#F7931A" stroke-opacity="1"/></g>
<rect x="30" y="70" width="140" height="70" rx="12" fill="#1d1408" stroke="#F7931A"/>
<g text-anchor="middle" font-size="16" font-weight="700" fill="#fff"><text x="100" y="100">Sender</text><text x="290" y="100">OHTTP relay</text><text x="480" y="100">Directory</text><text x="670" y="100">Receiver</text></g>
<g text-anchor="middle" font-size="12" fill="#9A9A9A"><text x="100" y="122">locks the PSBT</text><text x="290" y="122">hides your IP</text><text x="480" y="122">a mailbox</text><text x="670" y="122">unlocks, adds a coin</text></g>
