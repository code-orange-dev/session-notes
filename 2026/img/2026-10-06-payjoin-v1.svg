<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="640" height="330" rx="16" fill="#0f0f0f"/>
          <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F7931A"/></marker></defs>
          <rect x="40" y="20" width="150" height="40" rx="20" fill="#F7931A"/><text x="115" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#0A0A0A">Sender</text>
          <rect x="450" y="20" width="150" height="40" rx="20" fill="#5ac8fa"/><text x="525" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#0A0A0A">Receiver</text>
          <g stroke="#ffffff" stroke-opacity=".18" stroke-dasharray="4 5"><line x1="115" y1="60" x2="115" y2="320"/><line x1="525" y1="60" x2="525" y2="320"/></g>
          <g stroke="#F7931A" stroke-width="2" marker-end="url(#ah)"><line x1="520" y1="100" x2="122" y2="100"/><line x1="120" y1="160" x2="518" y2="160"/><line x1="520" y1="220" x2="122" y2="220"/></g>
          <g font-size="13" fill="#e8e8e8" text-anchor="middle">
            <text x="320" y="90"><tspan fill="#F7931A" font-weight="700">1</tspan>  Shares a bitcoin: link with pj=&lt;server&gt;</text>
            <text x="320" y="150"><tspan fill="#F7931A" font-weight="700">2</tspan>  Sends a fully signed payment (the “original PSBT”)</text>
            <text x="320" y="210"><tspan fill="#F7931A" font-weight="700">3</tspan>  Adds their own coin, signs it, sends it back</text>
            <text x="320" y="270"><tspan fill="#F7931A" font-weight="700">4</tspan>  Sender signs again and broadcasts the PayJoin</text>
          </g>
          <text x="320" y="306" text-anchor="middle" font-size="12" fill="#8A8A8A">Snooping sender? The receiver can just broadcast step 2 as a normal payment.</text>
        </svg>
