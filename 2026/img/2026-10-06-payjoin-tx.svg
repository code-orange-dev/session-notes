<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="640" height="260" rx="16" fill="#0f0f0f"/>
          <g fill="none" stroke-width="2"><path d="M190 70 C 260 70, 260 130, 300 130" stroke="#F7931A"/><path d="M190 190 C 260 190, 260 130, 300 130" stroke="#5ac8fa"/><path d="M340 130 C 380 130, 380 70, 450 70" stroke="#ffffff" stroke-opacity=".5"/><path d="M340 130 C 380 130, 380 190, 450 190" stroke="#ffffff" stroke-opacity=".5"/></g>
          <g font-size="11" font-weight="700" fill="#8A8A8A" letter-spacing="1.5"><text x="110" y="24" text-anchor="middle">INPUTS</text><text x="530" y="24" text-anchor="middle">OUTPUTS</text></g>
          <rect x="30" y="44" width="160" height="52" rx="12" fill="#1d1408" stroke="#F7931A"/><text x="110" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">≈58,000 sats</text><text x="110" y="86" text-anchor="middle" font-size="12" fill="#F7931A">sender’s coin</text>
          <rect x="30" y="164" width="160" height="52" rx="12" fill="#0b1720" stroke="#5ac8fa"/><text x="110" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">≈10,000 sats</text><text x="110" y="206" text-anchor="middle" font-size="12" fill="#5ac8fa">receiver’s coin</text>
          <circle cx="320" cy="130" r="26" fill="#F7931A"/><text x="320" y="135" text-anchor="middle" font-size="12" font-weight="800" fill="#0A0A0A">PayJoin</text>
          <rect x="450" y="44" width="160" height="52" rx="12" fill="#161616" stroke="#ffffff" stroke-opacity=".3"/><text x="530" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">≈22,000 sats</text><text x="530" y="86" text-anchor="middle" font-size="12" fill="#8A8A8A">output 1</text>
          <rect x="450" y="164" width="160" height="52" rx="12" fill="#161616" stroke="#ffffff" stroke-opacity=".3"/><text x="530" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">≈45,400 sats</text><text x="530" y="206" text-anchor="middle" font-size="12" fill="#8A8A8A">output 2</text>
          <text x="320" y="248" text-anchor="middle" font-size="13" fill="#c9c9c9">No output says 12,000. The receiver got 10,000 + 12,000 = 22,000 back.</text>
        </svg>
